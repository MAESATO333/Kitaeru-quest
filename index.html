<style>
/* Layout: one-column phone app. Soft pastel look for a mostly-female membership; the four stats keep bumper-plate hues (red, blue, yellow, green), softened. */
:root{
  --floor:#e6f4ff; --floor-2:#f1f8ff; --panel:#ffffff; --line:#d8e8f5; --stage:#f1e6fb;
  --chalk:#3d3450; --muted:#7f8aa1;
  --red:#f06b7e; --blue:#6aa8f0; --yellow:#f7c948; --green:#5cc98a;
  --gold:#e9a400; --accent:#e8578a;
  --display:"M PLUS Rounded 1c","Zen Maru Gothic","Hiragino Maru Gothic ProN",system-ui,sans-serif;
  --body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--floor);color:var(--chalk)}
body{font-family:var(--body);font-size:15px;line-height:1.6;min-height:100%;
  background-image:linear-gradient(180deg,#bfe5ff 0%,#e3f3ff 45%,#fff0f6 100%);background-repeat:no-repeat;background-size:100% 100%}
/* ロゴ：1文字ずつ色の違う丸いタイル */
.tiles{display:flex;gap:3px;flex-wrap:nowrap}
.tiles b{display:grid;place-items:center;width:26px;height:28px;border-radius:7px;color:#fff;font-family:var(--display);font-weight:800;font-size:16px;line-height:1;box-shadow:inset 0 -4px 0 rgba(0,0,0,.16)}
.tiles i{width:5px}
/* 浮島のステージ */
.scene{position:relative;margin-top:14px;border-radius:24px;overflow:hidden;background:linear-gradient(180deg,#9fd8ff,#d9f0ff 70%,#fbe8f2);border:2px solid #fff;box-shadow:0 6px 18px rgba(80,140,200,.18)}
.scene canvas{display:block;width:100%;height:auto;image-rendering:pixelated}
.nametag{position:absolute;left:50%;transform:translateX(-50%);top:8%;background:#fff;border:2px solid var(--accent);color:var(--accent);border-radius:999px;padding:2px 12px;font-weight:900;font-size:13px;white-space:nowrap;box-shadow:0 2px 0 rgba(232,87,138,.25)}
.nametag small{color:var(--muted);font-weight:700;margin-left:6px}
.bonus{margin-top:12px;background:#fff;border-radius:20px;padding:14px;text-align:center;border:2px solid #fde3ec;box-shadow:0 4px 0 #fde3ec}
.bonus .bt{font-size:13px;color:var(--muted)}
.bonus .bv{font-family:var(--display);font-weight:800;font-size:34px;color:#e0a100;line-height:1.3}
.bonus .bv small{font-size:15px}
.cloud{position:absolute;background:#fff;border-radius:999px;opacity:.9;animation:drift 18s linear infinite alternate}
@keyframes drift{from{transform:translateX(-12px)}to{transform:translateX(12px)}}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--floor-2)}
.app{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(255,255,255,.88);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
  margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-left,0px));display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.logo{font-family:var(--display);font-size:18px;white-space:nowrap;letter-spacing:.04em;flex:1;min-width:0}
.logo small{display:block;margin-top:3px;font-family:var(--body);font-size:11px;color:var(--muted);letter-spacing:.08em}
select,input,button{font:inherit;color:inherit}
select,input{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0}
button{cursor:pointer;border:0;border-radius:12px;padding:9px 14px;background:var(--panel);border:1px solid var(--line)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
.btn-main{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:900;border-radius:999px;box-shadow:0 3px 0 #c43d70}
.btn-main:active{transform:translateY(1px)}
.mode{font-size:12px;padding:6px 10px}
.mode.on{background:var(--blue);border-color:var(--blue)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#ffffff;border-top:1px solid var(--line);
  display:flex;justify-content:center;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav .in{display:flex;max-width:520px;width:100%;gap:2px}
nav button{flex:1;background:none;border:0;padding:6px 2px;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button .ic{font-family:var(--display);font-size:17px;line-height:1}
nav button.on{color:var(--chalk)}
nav button.on .ic{color:var(--accent)}
h2{font-family:var(--display);font-weight:800;color:var(--accent);font-size:18px;margin:22px 0 10px;letter-spacing:.04em}
.card{background:var(--panel);border:1.5px solid var(--line);border-radius:18px;box-shadow:0 2px 0 var(--line);padding:14px}
.stack{display:flex;flex-direction:column;gap:10px}
.muted{color:var(--muted);font-size:13px}
.demo{font-size:12px;color:var(--muted);border:1px dashed var(--line);border-radius:8px;padding:8px 10px;margin-top:12px}

/* hero */
.hero{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:center;margin-top:14px}
.sprite{width:120px;height:120px;image-rendering:pixelated;background:var(--stage);border:1px solid var(--line);border-radius:10px}
.name{font-weight:900;font-size:18px;line-height:1.3}
.cls{font-family:var(--display);color:var(--accent);font-size:14px}
.lv{font-family:var(--display);font-size:30px;line-height:1}
.bar{height:10px;background:var(--floor);border-radius:5px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--yellow);transition:width .6s}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.stat{display:flex;align-items:center;gap:10px;background:var(--floor-2);border-radius:14px;padding:8px 10px;min-width:0}
.plate{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--display);font-size:11px;color:#fff;
  box-shadow:inset 0 0 0 4px rgba(0,0,0,.25),inset 0 0 0 9px rgba(255,255,255,.12)}
.stat b{font-family:var(--display);font-weight:800;font-size:18px;display:block;line-height:1.1}
.stat span{font-size:11px;color:var(--muted)}
.titles{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--floor-2);border:1px solid var(--line)}
.chip.gold{border-color:var(--gold);color:var(--gold)}
.streak{display:flex;gap:4px;margin-top:6px}
.streak i{flex:1;height:18px;border-radius:3px;background:var(--floor-2);border:1px solid var(--line)}
.streak i.on{background:var(--green);border-color:var(--green)}

/* log */
.seg{display:flex;gap:6px}
.seg button{flex:1;font-size:13px}
.seg button.on{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px;min-width:0}
.preview{font-size:13px;color:var(--muted)}
.preview b{color:var(--accent);font-family:var(--display);font-weight:800;font-size:16px}

/* feed */
.post{display:grid;grid-template-columns:40px 1fr;gap:10px}
.av{width:40px;height:40px;border-radius:12px;background:var(--stage);image-rendering:pixelated}
.post .who{font-weight:700;font-size:14px}
.post .what{font-size:14px;margin-top:2px}
.post .meta{display:flex;justify-content:space-between;align-items:center;margin-top:6px;gap:8px}
.cheer{font-size:12px;padding:4px 10px}
.cheer.done{border-color:var(--red);color:var(--red)}
.tag{font-size:11px;font-weight:700;padding:1px 6px;border-radius:4px;color:#111}

/* rank */
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td{padding:8px 4px;border-bottom:1px solid var(--line);font-size:14px}
td.n{font-family:var(--display);width:30px;color:var(--muted)}
td.r{text-align:right;font-family:var(--display)}
tr.me td{color:var(--accent)}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;text-align:center}
.vs .big{font-family:var(--display);font-size:24px}

/* boss */
.boss{text-align:center}
.boss canvas{width:180px;height:180px;image-rendering:pixelated;display:block;margin:8px auto}
.hp{height:16px;background:var(--floor);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.hp i{display:block;height:100%;background:var(--red);transition:width .8s}
.contrib{display:flex;flex-direction:column;gap:6px;text-align:left;margin-top:12px}
.contrib div{display:grid;grid-template-columns:5.5em 1fr 4em;gap:8px;align-items:center;font-size:13px}
.contrib s{display:block;height:8px;background:var(--blue);border-radius:4px;text-decoration:none}

/* overlay */
.ov{position:fixed;inset:0;z-index:20;background:rgba(255,240,246,.94);display:grid;place-items:center;padding:24px}
.ov .box{text-align:center;max-width:320px}
.ov .t{font-family:var(--display);font-size:36px;color:var(--accent);animation:pop .5s ease-out}
.ov .s{margin:8px 0 18px}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.hw{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hw .btn-main{flex:none;padding:8px 12px}
.stampmark{flex:none;width:44px;height:44px;border-radius:50%;border:3px solid var(--red);color:var(--red);display:grid;place-items:center;font-weight:900;font-size:18px;transform:rotate(-12deg)}
@media (max-width:440px){.logo{flex-basis:100%}}
.zk{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.zc{background:var(--panel);border:1.5px solid var(--line);border-radius:16px;padding:8px;text-align:center;min-width:0}
.zc canvas{width:100%;max-width:96px;aspect-ratio:1;image-rendering:pixelated;background:var(--stage);border-radius:10px;display:block;margin:0 auto}
.zc.lock canvas{opacity:.7}
.zc.now{border-color:var(--accent)}
.zl{font-family:var(--display);color:var(--accent);font-size:13px;margin-top:4px}
.zy{font-size:10px;color:var(--muted);line-height:1.3;word-break:break-all}
.zn{font-weight:700;font-size:13px;line-height:1.3}
.za{font-size:11px;color:var(--muted);line-height:1.4}
.zt{font-size:11px;font-weight:900;color:#111;background:var(--yellow);border-radius:4px;margin-top:4px}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:15;background:var(--chalk);color:var(--floor);font-weight:700;padding:8px 14px;border-radius:8px;font-size:14px;max-width:90vw}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>
<body>

  <header>

</div>

<script>
// ---------- data ----------
const KEY='kq-proto-v7';
const LOOKS=[['m','男性'],['f','女性'],['dog','犬'],['cat','猫'],['sheep','ひつじ'],['giraffe','キリン'],['hamster','ハムスター'],['g','八百万の神']];
// 文字の絵で顔を描く（.は透明）
function GRID(R,rows,pal){rows.forEach((r,y)=>[...r].forEach((ch,x)=>{if(ch!=='.'){let col=pal[ch];if(typeof col==='function')col=col(x,y);R(x,y,1,1,col);}}));}
const SHEEP=[

const SHEEP_PAL={w:(x,y)=>(x+2*y)%4===0?'#e2ddd3':'#ffffff',f:'#f6e2cf',k:'#1a1a1a',e:'#d9c2b0',n:'#e59aa0'};
const HAM=[

// 動物の顔（16x16の上半分）。fur=毛の色（腕もこの色）
const ANIMALS={
 dog:{fur:'#d98e3e',dark:'#a8662a',head:(R,P,f,d)=>{R(5,2,6,5,f);R(6,7,4,1,f);R(6,5,4,2,'#f6e3c4');P([[7,5],[8,5]],'#1a1a1a');P([[6,4],[9,4]],'#1a1a1a');P([[7,6],[8,6]],'#e8b9a0');},ears:(R,P,f,d)=>{P([[5,0],[5,1],[6,1],[10,0],[10,1],[9,1]],f);P([[5,1],[10,1]],d);}},
 cat:{fur:'#fbf8f2',dark:'#e08a3c',head:(R,P,f,d)=>{R(5,2,6,5,f);R(6,7,4,1,f);P([[5,2],[6,2],[5,3]],'#e08a3c');P([[9,2],[10,2],[10,3]],'#2b2b2b');P([[6,4],[9,4]],'#1a1a1a');P([[7,5],[8,5]],'#f29aa8');P([[3,5],[4,6],[12,5],[11,6]],'#b8bcc4');},ears:(R,P,f,d)=>{P([[5,0],[5,1],[6,1]],'#e08a3c');P([[10,0],[10,1],[9,1]],'#2b2b2b');P([[5,1],[10,1]],'#f29aa8');}},

const FEMALE=new Set('ユイ,ハナ,ミサキ,サクラ,メイ,ナナ,アヤ,マオ,リナ,エマ,ミオ,ユナ,サキ,モモ,アカリ,ヒナ,マユ,チカ,アン,カホ,ミク,ルナ,シオリ,ユズ,コハル,ナツ,セナ,ワカ,アユ,ミズキ,ユキ,カナ,スミレ,ノゾミ,エリ,ミホ,ユリ'.split(','));

const TEAMS={am:{name:'朝焼け団',color:'var(--yellow)',hex:'#f2c230'},pm:{name:'月夜団',color:'var(--blue)',hex:'#3a7bea'}};
const STAMPS=[
  {id:'form',label:'ナイスフォーム！',stat:'tec',xp:40},

const TITLES=['スクワットの申し子','朝活マスター','皆勤の守護者','笑顔のムードメーカー','フォームの達人','有酸素の旅人'];
const EXERCISES=['スクワット','ベンチプレス','デッドリフト','ラットプルダウン','ショルダープレス','レッグプレス'];
const CARDIO=['トレッドミル','バイク','クロストレーナー','ローイング'];

const HOMEWORK=['自宅でスクワット 20回×3セット','お風呂上がりにストレッチ 10分','1日8,000歩 歩く','プランク 1分×3セット','タンパク質を毎食とる','寝る前に腹筋 15回×2セット'];
function seed(){
  const now=Date.now();
  const m=(id,name,team,s,titles,streak)=>({id,name,team,stats:s,titles,streak,weekXp:0,checkins:[]});
  const members=[
    m('me','あなた','am',{str:180,end:90,tec:60,grit:120},[],[1,0,0,1,0,0,0]),
    m('k','ケンタ','pm',{str:820,end:160,tec:200,grit:300},['スクワットの申し子'],[1,1,1,0,1,1,0]),

  const w={me:520,k:1680,y:1420,t:980,h:1210,s:310};
  members.forEach(x=>x.weekXp=w[x.id]);
  // デモ用の追加会員（実際の会員数は画面に出さない）
  const NAMES='アオイ,リク,ミサキ,ダイチ,サクラ,ハルト,メイ,ソウタ,ナナ,レン,アヤ,ユウキ,マオ,カイト,リナ,ツバサ,エマ,ヒロ,ミオ,タクミ,ノア,コウ,ユナ,ジュン,サキ,ケイ,モモ,ショウタ,アカリ,ユウト,ヒナ,ソラ,マユ,ダイキ,チカ,リョウ,アン,ナオキ,カホ,ヨウ,ミク,ゴウ,ルナ,イツキ,シオリ,テツ,ユズ,マサキ,コハル,ヒカル,ナツ,セナ,トモ,ワカ,キョウ,アユ,ハヤト,ミズキ,ユキ,ガク,カナ,ジン,レイ,スミレ,タイガ,ノゾミ,コウキ,エリ,シン,ミホ,ケンジ,ハル,ユリ,オウガ'.split(',');
  let r=12345;const rnd=()=>(r=(r*1103515245+12345)%2147483648)/2147483648;
  const ex=['スクワット','ベンチプレス','デッドリフト','ラットプルダウン'],car=['トレッドミル','バイク','ローイング'];
  const extraFeed=[];
  NAMES.forEach((n,i)=>{
    const id='g'+i,x=m(id,n,i%2?'pm':'am',{str:Math.round(60+rnd()*700),end:Math.round(40+rnd()*600),tec:Math.round(20+rnd()*300),grit:Math.round(40+rnd()*400)},

// 浮島の上にキャラクターを立たせた場面（ホーム画面用）
function drawScene(cv,m){
  const W=320,H=200;cv.width=W;cv.height=H;const c=cv.getContext('2d');c.imageSmoothingEnabled=false;c.clearRect(0,0,W,H);
  const cx=160,cy=128,hw=118,hh=40,th=26;
  const poly=(pts,col)=>{c.fillStyle=col;c.beginPath();pts.forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y));c.closePath();c.fill();};
  // 側面（土）と草の縁
  poly([[cx-hw,cy],[cx,cy+hh],[cx,cy+hh+th],[cx-hw,cy+th]],'#c48a5c');
  poly([[cx+hw,cy],[cx,cy+hh],[cx,cy+hh+th],[cx+hw,cy+th]],'#a8714a');
  poly([[cx-hw,cy],[cx,cy+hh],[cx,cy+hh+7],[cx-hw,cy+7]],'#8fd16e');
  poly([[cx+hw,cy],[cx,cy+hh],[cx,cy+hh+7],[cx+hw,cy+7]],'#76bb59');
  // 上面（芝生のタイル）
  poly([[cx,cy-hh],[cx+hw,cy],[cx,cy+hh],[cx-hw,cy]],'#b3e88c');
  c.strokeStyle='rgba(255,255,255,.35)';c.lineWidth=1;
  for(let i=1;i<6;i++){const t=i/6;c.beginPath();c.moveTo(cx-hw+hw*t,cy-hh*t);c.lineTo(cx+hw*t,cy+hh-hh*t);c.stroke();c.beginPath();c.moveTo(cx+hw-hw*t,cy-hh*t);c.lineTo(cx-hw*t,cy+hh-hh*t);c.stroke();}
  // 道（クリーム色）
  poly([[cx-14,cy-hh+7],[cx+hw-30,cy-6],[cx+hw-46,cy+2],[cx-30,cy-hh+15]],'#fbefb8');
  // 木（ブロック）
  const box=(x,y,w,h,d,top,l,r)=>{poly([[x,y],[x+w,y-w/2],[x+w+d,y-w/2+d/2],[x+d,y+d/2]],top);poly([[x,y],[x+d,y+d/2],[x+d,y+d/2+h],[x,y+h]],l);poly([[x+d,y+d/2],[x+w+d,y-w/2+d/2],[x+w+d,y-w/2+d/2+h],[x+d,y+d/2+h]],r);};
  box(66,96,8,22,8,'#9a6a44','#a8754c','#8a5c3a');box(52,70,22,22,22,'#8be08a','#6cc56c','#58ad58');
  // ダンベル
  c.fillStyle='#7d8494';c.fillRect(218,128,24,3);c.fillStyle='#ec6a84';c.fillRect(214,123,6,13);c.fillRect(240,123,6,13);
  // 花
  [[110,140,'#ff9cc0'],[196,150,'#ffe27a'],[250,118,'#c7a8ff'],[96,124,'#ffffff']].forEach(([x,y,col])=>{c.fillStyle=col;c.fillRect(x,y,4,4);});
  // キャラクター（影つき）
  c.fillStyle='rgba(0,0,0,.12)';c.beginPath();c.ellipse(cx,cy+2,30,8,0,0,7);c.fill();
  const sp=document.createElement('canvas');drawSprite(sp,m);c.drawImage(sp,cx-48,cy-92,96,96);
}
function drawSprite(cv,m){const st=stageOfLv(levelOf(total(m)).lv);if(m.look==='g')return paintKami(cv,st,STAT[topStat(m)].hex);paintHero(cv,st,STAT[topStat(m)].hex,hairOf(m),m.look);}
function drawBoss(cv,ratio){
  const art=`....rrrrrr....
...rrrrrrrr...
..rrryrryrrr..
..rrrrrrrrrr..
.rrrrdddddrrr.
rrr.rrrrrr.rrr
rr..rrrrrr..rr
rr..rrrrrr..rr
....rrrrrr....
....rr..rr....
...rrr..rrr...
..rrrr..rrrr..`;
  const n=14;cv.width=n;cv.height=12;const c=cv.getContext('2d');c.clearRect(0,0,n,12);
  const col=ratio<=0?'#4a4f5c':'#7d8494';
  art.split('\n').forEach((r,y)=>[...r].forEach((ch,x)=>{const p={r:col,y:ratio<=0?'#222':'#f2c230',d:'#2a2d35'}[ch];if(p){c.fillStyle=p;c.fillRect(x,y,1,1)}}));
}

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function ago(t){const d=(Date.now()-t)/60000;if(d<1)return'たった今';if(d<60)return Math.floor(d)+'分前';if(d<1440)return Math.floor(d/60)+'時間前';return Math.floor(d/1440)+'日前';}
let toastT;function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2200);}
function overlay(title,sub){const o=$('#ov');o.innerHTML=`<div class="box"><div class="t">${esc(title)}</div><div class="s">${esc(sub)}</div><button class="btn-main" id="ovClose" type="button">つづける</button></div>`;o.hidden=false;$('#ovClose').onclick=()=>o.hidden=true;$('#ovClose').focus();}

function gain(m,stat,xp,text,extra={}){
  let boosted=false;
  if(!extra.by&&m.boost>0&&(stat==='str'||stat==='end')){xp=Math.round(xp*1.5);m.boost--;boosted=true;text+='（気合ブースト×1.5）';}
  const before=levelOf(total(m)).lv, cb=classOf(m);
  m.stats[stat]+=xp;m.weekXp+=xp;
  S.feed.unshift({id:S.nextId++,who:extra.by||m.id,to:extra.by?m.id:undefined,text,xp,stat,t:Date.now(),cheers:[],pb:extra.pb});
  const after=levelOf(total(m)).lv, ca=classOf(m);
  save();
  if(m.id===S.current&&after>before){
    const evo=stageOfLv(after)>stageOfLv(before);
    overlay(`LEVEL ${after}!`,evo?`進化！「${evoInfo(m.look,stageOfLv(after)).name}${evoInfo(m.look,stageOfLv(after)).yomi?`（${evoInfo(m.look,stageOfLv(after)).yomi}）`:''}」 ${evoInfo(m.look,stageOfLv(after)).add}`:ca!==cb?`職業が「${ca}」になりました！`:`${STAT[stat].name}が上がった！ この調子！`);
  }else toast(`${STAT[stat].name} +${xp} EXP${boosted?'　ブースト発動！':''}`);
}

    f.innerHTML=`<div class="stack"><div class="muted">ジムに来たらタップ。本番では受付のQRコードを読む形を想定しています。</div>
      <div class="preview">根性 <b>+20</b> EXP ／ 週3回でクエスト達成</div>
      <button class="btn-main" id="go" type="button" ${done?'disabled style="opacity:.5"':''}>${done?'今日はチェックイン済み':'チェックインする'}</button></div>`;
    if(!done)$('#go').onclick=()=>{m.streak[today]=1;gain(m,'grit',20,'ジムにチェックイン');tab='hero';render()};
  }
}

function vFeed(){
  const m=me();
  const v=visibleIds(),posts=S.feed.filter(p=>v.has(p.who==='trainer'?p.to:p.who)).slice(0,40);
  $('#view').innerHTML=`<h2>酒場（今日の顔ぶれ）</h2><p class="muted" style="margin-top:-6px">表示される仲間は毎日入れ替わります。エールを送ると、送った人も受け取った人も「根性」+2。</p>
  <div class="stack">${posts.map(p=>{
    const isT=p.who==='trainer', w=isT?null:byId(p.who), cheered=p.cheers.includes(m.id);
    return `<div class="card post"><canvas class="av" data-av="${isT?'':p.who}"></canvas><div style="min-width:0">
      <div class="who">${isT?'トレーナー':esc(w.name)} ${p.pb?'<span class="tag" style="background:var(--yellow)">自己ベスト</span>':''}</div>
      <div class="what">${esc(p.text)}</div>
      <div class="meta"><span class="muted"><span class="tag" style="background:${STAT[p.stat].c}">${STAT[p.stat].name}+${p.xp}</span> ${ago(p.t)}</span>
      <button type="button" class="cheer ${cheered?'done':''}" data-c="${p.id}" ${p.who===m.id?'disabled':''}>エール ${p.cheers.length}</button></div></div></div>`}).join('')}</div>`;
  document.querySelectorAll('canvas[data-av]').forEach(c=>{const w=byId(c.dataset.av);if(w)drawSprite(c,w);else{c.width=1;c.height=1;const x=c.getContext('2d');x.fillStyle='#e8578a';x.fillRect(0,0,1,1)}});
  document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{
    const p=S.feed.find(x=>x.id==b.dataset.c);if(p.cheers.includes(m.id))return;
    p.cheers.push(m.id);m.stats.grit+=2;const tgt=byId(p.to||p.who);if(tgt){tgt.stats.grit+=2}save();toast('エールを送りました！ 根性+2');vFeed()});
}

function vRank(){
  const list=visibleMembers().sort((a,b)=>b.weekXp-a.weekXp);
  const tsum=k=>S.members.filter(m=>m.team===k).reduce((a,m)=>a+m.weekXp,0);
  const a=tsum('am'),p=tsum('pm');
  $('#view').innerHTML=`<h2>チーム対抗戦（今週）</h2>
  <div class="card"><div class="vs">
    <div><div class="big" style="color:${TEAMS.am.color}">${Math.round(a/(a+p)*100)}%</div><div class="muted">${TEAMS.am.name}</div></div>
    <div class="muted">VS</div>
    <div><div class="big" style="color:${TEAMS.pm.color}">${100-Math.round(a/(a+p)*100)}%</div><div class="muted">${TEAMS.pm.name}</div></div></div>
    <div class="bar" style="margin-top:10px;background:${TEAMS.pm.hex}"><i style="width:${a/(a+p)*100}%;background:${TEAMS.am.hex}"></i></div>
  </div>
  <h2>今日の顔ぶれ番付（今週のEXP）</h2>
  <div class="card"><table>${list.map((m,i)=>`<tr class="${m.id===S.current?'me':''}"><td class="n">${i+1}</td><td>${esc(m.name)} <span class="muted">Lv${levelOf(total(m)).lv}</span></td><td class="r">${m.weekXp.toLocaleString()}</td></tr>`).join('')}</table>
  <p class="muted" style="margin:8px 0 0">顔ぶれは毎日入れ替わり、番付は毎週月曜にリセット。ベテランも初心者も、毎週横一線から。</p></div>`;
}

function vBoss(){
  const dmg=S.members.reduce((a,m)=>a+m.weekXp,0),hp=Math.max(0,S.boss.max-dmg),r=hp/S.boss.max;
  const list=visibleMembers().sort((a,b)=>b.weekXp-a.weekXp).slice(0,10);if(!list.find(m=>m.id===S.current))list.push(me());const mx=list[0].weekXp||1;
  $('#view').innerHTML=`<h2>今週のボス</h2>
  <div class="card boss">
    <div style="font-family:var(--display);font-size:20px">${esc(S.boss.name)}</div>
    <canvas id="bc" aria-label="ボスの姿"></canvas>
    <div class="hp"><i style="width:${r*100}%"></i></div>
    <div class="muted" style="margin-top:6px">${r>0?`残りHP ${Math.round(r*100)}%　あと少し！`:'討伐成功！ 全員に報酬 +100 EXP'}</div>
    <div class="muted" style="text-align:left;margin-top:12px">今日の顔ぶれの活躍</div><div class="contrib" style="margin-top:6px">${list.map(m=>`<div><span>${esc(m.name)}</span><s style="width:${m.weekXp/mx*100}%"></s><span class="muted" style="text-align:right">${m.weekXp}</span></div>`).join('')}</div>
  </div>
  <p class="muted">ジム全員の今週のEXP合計がボスへのダメージになります。1回のトレーニングが、みんなの力になります。</p>`;
  drawBoss($('#bc'),r);
}

let zLook='m';
function vZukan(){
  const m=me(),lv=levelOf(total(m)).lv,cur=stageOfLv(lv),cls=STAT[topStat(m)].hex;
  $('#view').innerHTML=`<h2>進化図鑑</h2>
  <p class="muted" style="margin-top:-6px">${zLook==='g'?'5レベルごとに別の神様へ姿を変えます。Lv5の少彦名命から20柱を巡り、Lv100で天照大神に。':'5レベルごとに見た目が進化します。Lv100の「伝説」まで全21段階。'}Lv100からは10レベルごとに名前の横に★が増え、上限はありません。色は一番伸びている能力の色になります。</p>
  <label style="margin-bottom:10px">見た目を選ぶ<select id="zlk">${LOOKS.map(([k,l])=>`<option value="${k}" ${zLook===k?'selected':''}>${l}</option>`).join('')}</select></label>
  <div class="zk">${(zLook==='g'?KAMI.map((k,i)=>({...k,lv:EVO[i].lv})):EVO).map((e,i)=>`<div class="zc ${i===cur?'now':''} ${i>cur?'lock':''}"><canvas data-zs="${i}"></canvas>
    <div class="zl">Lv${e.lv}</div>${e.yomi?`<div class="zy">${e.yomi}</div>`:''}<div class="zn">${e.name}</div><div class="za">${e.add}</div>${i===cur?'<div class="zt">いまここ</div>':''}</div>`).join('')}</div>
  <button type="button" id="back" style="margin-top:14px">冒険者に戻る</button>`;
  document.querySelectorAll('[data-zs]').forEach(c=>zLook==='g'?paintKami(c,+c.dataset.zs,cls):paintHero(c,+c.dataset.zs,cls,hairOf({id:'me',name:'',look:zLook}),zLook));
  $('#zlk').onchange=e=>{zLook=e.target.value;vZukan()};
  $('#back').onclick=()=>{tab='hero';render()};
}

function vGuild(){
  const waiting=S.members.flatMap(m=>m.homework.filter(h=>h.status==='done').map(h=>({m,h})));
  $('#view').innerHTML=`<h2>宿題のスタンプ待ち（${waiting.length}件）</h2>
  <div class="stack">${waiting.length?waiting.map(({m,h})=>`<div class="card hw"><div style="min-width:0"><div style="font-weight:700">${esc(m.name)}</div><div class="muted">${esc(h.text)}</div></div>
    <button type="button" class="btn-main" data-st="${m.id}:${h.id}">スタンプを押す</button></div>`).join(''):'<div class="card muted">スタンプ待ちの宿題はありません。</div>'}</div>
  <h2>宿題を出す</h2>
  <div class="card stack">
    <label>会員<select id="hm">${S.members.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('')}</select></label>
    <label>宿題<select id="ht">${HOMEWORK.map(t=>`<option>${t}</option>`).join('')}</select></label>
    <button class="btn-main" id="hgive" type="button">宿題を出す</button>
  </div>
  <h2>トレーナー：会員を評価する</h2>
  <div class="card stack">
    <label>会員<select id="gm">${S.members.map(m=>`<option value="${m.id}">${esc(m.name)}（Lv${levelOf(total(m)).lv}）</option>`).join('')}</select></label>
    <div class="muted">スタンプを押す</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">${STAMPS.map(s=>`<button type="button" data-s="${s.id}" style="border-color:${STAT[s.stat].c}">${s.label}<br><span class="muted">${STAT[s.stat].name}+${s.xp}</span></button>`).join('')}</div>
  </div>
  <h2>称号を授ける</h2>
  <div class="card stack">
    <label>称号<select id="gt">${TITLES.map(t=>`<option>${t}</option>`).join('')}</select></label>
    <button class="btn-main" id="give" type="button">この会員に授ける</button>
  </div>
  <h2>今週のクエストを出す</h2>
  <div class="card stack">
    <label>内容<input id="qt" value="${esc(S.quest.text)}"></label>
    <button id="qset" type="button">クエストを更新</button>
  </div>`;
  document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{const s=STAMPS.find(x=>x.id===b.dataset.s),m=byId($('#gm').value);
    gain(m,s.stat,s.xp,`${m.name}さんに「${s.label}」スタンプ`,{by:'trainer'});});
  $('#give').onclick=()=>{const m=byId($('#gm').value),t=$('#gt').value;if(m.titles.includes(t)){toast('すでに持っている称号です');return}
    m.titles.push(t);S.feed.unshift({id:S.nextId++,who:'trainer',to:m.id,text:`${m.name}さんに称号「${t}」を授与`,xp:0,stat:'tec',t:Date.now(),cheers:[]});save();toast(`称号「${t}」を授けました`)};
  document.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{
    const [mid,hid]=b.dataset.st.split(':'),m=byId(mid),h=m.homework.find(x=>x.id==hid);
    h.status='stamped';m.boost=(m.boost||0)+2;
    const before=levelOf(total(m)).lv;['str','end','tec','grit'].forEach(k=>m.stats[k]+=15);m.weekXp+=60;
    S.feed.unshift({id:S.nextId++,who:'trainer',to:m.id,text:`${m.name}さんの宿題「${h.text}」にスタンプ！ パワーアップ`,xp:60,stat:'grit',t:Date.now(),cheers:[]});save();
    const after=levelOf(total(m)).lv;
    if(m.id===S.current)overlay('POWER UP!',`全能力+15${after>before?`、レベル${after}に！`:''}　次の2回のトレーニングはEXP1.5倍`);
    else toast(`${m.name}さんがパワーアップしました`);
    vGuild()});
  $('#hgive').onclick=()=>{const m=byId($('#hm').value);m.homework.push({id:S.hwId++,text:$('#ht').value,status:'open',t:Date.now()});save();toast(`${m.name}さんに宿題を出しました`)};
  $('#qset').onclick=()=>{S.quest.text=$('#qt').value||S.quest.text;save();toast('クエストを更新しました')};
}

$('#who').onchange=e=>{S.current=e.target.value;save();render()};
$('#modeBtn').onclick=()=>{S.trainerMode=!S.trainerMode;if(S.trainerMode)tab='guild';save();render()};
render();
// ホーム画面アプリ用：オフラインでも開けるようにする
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
</script>
</body>
</html>
