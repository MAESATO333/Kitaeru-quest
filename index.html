<style>html{-webkit-text-size-adjust:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}button{-webkit-tap-highlight-color:transparent}
#gate{position:fixed;inset:0;z-index:9999;background:linear-gradient(180deg,#e9f6c9,#fdf7d8);display:none;align-items:center;justify-content:center;padding:16px;overflow:auto}
body.locked #gate{display:flex}body.authwait #gate .gc{display:none}#gate .gwait{display:none;flex-direction:column;align-items:center;gap:10px;color:#33501a;font-weight:800;font-size:16px}body.authwait #gate .gwait{display:flex}#gate .gwait i{width:42px;height:42px;border-radius:50%;border:5px solid #cfe3a8;border-top-color:#33501a;animation:gwspin .8s linear infinite}@keyframes gwspin{to{transform:rotate(360deg)}}body.locked>*:not(#gate):not(script){visibility:hidden}
#gate .gc{width:100%;max-width:380px;background:#fff;border:3px solid #3f9a3a;border-radius:20px;padding:22px 18px;box-shadow:0 8px 0 #2f6d2a;display:flex;flex-direction:column;gap:12px}
#gate h1{margin:0;font-size:26px;color:#2f6d2a;text-align:center;font-family:var(--display,inherit)}#gate .gs{text-align:center;color:#5a6a4a;font-size:13px;margin:-6px 0 4px}
#gate label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:#4a5a3a;font-weight:700}#gate input{font-size:16px;padding:12px;border-radius:12px;border:2px solid #cfe6a8}
#gate .gb{background:#e8452c;color:#fff;border:0;border-radius:14px;padding:14px;font-size:17px;font-weight:800;cursor:pointer;box-shadow:0 4px 0 #b5321e}#gate .gb:disabled{opacity:.6}
#gate .gl{background:none;border:0;color:#5a6a4a;text-decoration:underline;font-size:13px;cursor:pointer}#gate .gm{min-height:1.4em;font-size:13px;color:#c0392b;text-align:center;line-height:1.5}#gate .gm.ok{color:#2f6d2a}
#gate .gor{display:flex;align-items:center;gap:8px;color:#9aa88a;font-size:12px}#gate .gor::before,#gate .gor::after{content:"";flex:1;height:1px;background:#d7e6bd}
#gate .ggl{display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;color:#3c4043;border:2px solid #dadce0;border-radius:14px;padding:12px;font-size:16px;font-weight:700;cursor:pointer}#gate .ggl:disabled{opacity:.6}
#gate .gn{font-size:12px;color:#7a8a6a;text-align:center;line-height:1.6}
#logoutBtn{display:none}body.signed #logoutBtn{display:inline-block}
body.member #modeBtn,body.member #kensaBtn,body.member #who{display:none!important}
.acct{border:2px solid #3f9a3a;border-radius:14px;background:#f4fbe8;padding:12px;display:flex;flex-direction:column;gap:8px;margin-bottom:12px}.acct h3{margin:0;font-size:16px;color:#2f6d2a}.acct .r2{display:grid;grid-template-columns:1fr 1fr;gap:6px}.acct input,.acct select{font-size:15px;width:100%;box-sizing:border-box}
.acct ul{list-style:none;margin:0;padding:0;max-height:220px;overflow:auto}.acct li{display:flex;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid #dcebc4;font-size:13px}.acct li span{flex:1;min-width:0;word-break:break-all}.acct li small{background:#3f9a3a;color:#fff;border-radius:6px;padding:1px 6px}.acct li small.m{background:#e8a33c}.acct li button{border:1px solid #3f9a3a;background:#fff;color:#2f6d2a;border-radius:8px;padding:3px 6px;font-size:11px;cursor:pointer}
</style>

<style>
/* Layout: one-column phone app. Soft pastel look for a mostly-female membership; the four stats keep bumper-plate hues (red, blue, yellow, green), softened. */
:root{
  --floor:#f3f9dc; --floor-2:#f6fbe4; --panel:#ffffff; --line:#dcebaa; --stage:#f1f8d2;
  --chalk:#2f3a1c; --muted:#7a8460; --ink:#33501a; --leaf:#4f7d2a; --lime:#bcdc3c; --lemon:#ffe600; --tomato:#e8452c; --carrot:#f39a1e; --beet:#9b2f5e; --banana:#f5d63d; --kiwi:#9ccc3c; --kiwi-skin:#8a6a3a; --soy:#efdca6;
  --red:#f06b7e; --blue:#6aa8f0; --yellow:#f7c948; --green:#5cc98a;
  --gold:#e08a00; --accent:#e8452c;
  --display:"M PLUS Rounded 1c","Zen Maru Gothic","Hiragino Maru Gothic ProN",system-ui,sans-serif;
  --body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--floor);color:var(--chalk)}
body{font-family:var(--body);font-size:15px;line-height:1.6;min-height:100%;
  background-image:linear-gradient(180deg,#e9f5b4 0%,#f4fadc 45%,#fffbe6 100%);background-repeat:no-repeat;background-size:100% 100%}
/* ロゴ：黄色の太文字＋深緑のふち、緑の帯 */
.vlogo{display:inline-flex;flex-direction:column;align-items:flex-start;gap:2px}
.vlogo b{font-family:var(--display);font-weight:800;font-size:23px;letter-spacing:.04em;line-height:1.15;color:var(--lemon);
  -webkit-text-stroke:2.5px var(--ink);paint-order:stroke fill;text-shadow:0 3px 0 var(--ink)}
.vlogo span{background:var(--leaf);color:#fff;font-size:11px;font-weight:700;letter-spacing:.14em;padding:1px 10px;border-radius:3px}
.vlogo span i{font-style:normal;color:var(--lemon)}
header::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:6px;background:repeating-linear-gradient(90deg,#e8452c 0 10px,#f39a1e 10px 20px,#f5d63d 20px 30px,#efdca6 30px 40px,#9ccc3c 40px 50px,#4f7d2a 50px 60px,#8a6a3a 60px 70px,#9b2f5e 70px 80px)}
/* 食べ物 */
.food{width:48px;height:48px;image-rendering:pixelated;flex:none}
.bonus .fd{display:flex;align-items:center;justify-content:center;gap:10px;margin:2px 0 4px}
.bonus .fn{font-weight:900;color:var(--ink);font-size:15px;text-align:left;line-height:1.3}
.bonus .fn small{display:block;font-weight:700;font-size:11px;color:var(--muted)}
.pantry{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.pc{background:#fff;border:2px solid var(--line);border-radius:14px;padding:6px 3px;text-align:center;min-width:0;box-shadow:0 3px 0 #c9df82}
.pc .food{width:40px;height:40px;display:block;margin:0 auto}
.pc.none .food{filter:none}.pc.none{position:relative}.pc.none::after{content:'まだ';position:absolute;top:4px;right:4px;font-size:9px;font-weight:800;background:#fff;border:1.5px solid #ccc;color:#888;border-radius:999px;padding:0 5px}
.pc.none b{color:inherit}
.pc.rare{background:linear-gradient(160deg,#fffbe0,#ffe9f2 60%,#e9f7ff);border-color:#f5c518}
.heroes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}
.vhero{overflow:hidden;background:#fff;border:2px solid var(--line);border-radius:12px;padding:4px 2px 5px;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0;font-family:inherit;color:var(--ink);cursor:pointer}
.vhero.on{border-color:#f5c518;background:linear-gradient(160deg,#fffbe0,#fff);box-shadow:0 0 0 2px #f5c518}
.vhero canvas{width:100%;max-width:64px;aspect-ratio:27/22;image-rendering:pixelated}
.vhero b{font-size:9.5px;line-height:1.2;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;max-width:100%}
.vhero span{font-size:8px;color:var(--muted);line-height:1.2;text-align:center}
.buddy{position:absolute;right:9%;bottom:16%;width:86px;aspect-ratio:27/22;image-rendering:pixelated;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
body.kensa header::after{content:'検査モード：すべてのページと項目を表示中';display:block;margin-top:6px;background:var(--tomato);color:#fff;font-size:11px;font-weight:800;text-align:center;border-radius:6px;padding:2px 0}
.shelf{display:inline-block;margin:10px 0 6px;background:var(--leaf);color:#fff;font-weight:900;font-size:12px;padding:2px 12px;border-radius:999px;letter-spacing:.1em}
.pc .st{color:#fff;border-radius:4px;padding:0 4px;margin-right:2px;font-weight:900}
.pc b.ln{font-size:9.5px;letter-spacing:-.02em;word-break:normal}.pc b{display:block;font-size:11px;line-height:1.25;color:var(--ink);min-height:2.5em;display:grid;place-items:center;word-break:break-all}
.pc .ct small{font-size:10px}.pc .ct{font-family:var(--display);font-weight:800;font-size:17px;color:var(--ink);line-height:1.1}
.pc .ef{font-size:10.5px;color:var(--muted);line-height:1.35}
.pc .tt{font-size:9.5px;line-height:1.3;margin-top:4px;border-radius:8px;padding:1px 3px;background:var(--floor-2);color:var(--muted)}
.pc .tt.got{background:var(--lemon);color:var(--ink);font-weight:900}
/* 浮島のステージ */
.scene{position:relative;margin-top:14px;border-radius:24px;overflow:hidden;background:linear-gradient(180deg,#d6ec7a,#eef7c4 65%,#fff6cc);border:3px solid var(--leaf);box-shadow:0 5px 0 var(--ink)}
.scene canvas{display:block;width:100%;height:auto;image-rendering:pixelated}
.nametag{position:absolute;left:50%;transform:translateX(-50%);top:8%;background:#fff;border:2px solid var(--ink);color:var(--ink);border-radius:999px;padding:2px 12px;font-weight:900;font-size:13px;white-space:nowrap;box-shadow:0 2px 0 var(--ink)}
.nametag small{color:var(--muted);font-weight:700;margin-left:6px}
.bonus{margin-top:12px;background:linear-gradient(180deg,#fffbea,#fbf1cf);border-radius:20px;padding:14px;text-align:center;border:3px solid var(--carrot);box-shadow:0 4px 0 #c77300}
.bonus .bt{font-size:13px;color:var(--muted)}
.bonus .bv{font-family:var(--display);font-weight:800;font-size:34px;color:var(--lemon);-webkit-text-stroke:2.5px var(--ink);paint-order:stroke fill;text-shadow:0 3px 0 var(--ink);line-height:1.3}
.bonus .bv small{font-size:15px;-webkit-text-stroke:0;color:var(--ink);text-shadow:none}
.cloud{position:absolute;background:#fff;border-radius:999px;opacity:.9;animation:drift 18s linear infinite alternate}
@keyframes drift{from{transform:translateX(-12px)}to{transform:translateX(12px)}}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--floor-2)}
.app{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
header{position:relative;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(214,236,110,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
  margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-left,0px));display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.logo{font-family:var(--display);font-size:18px;white-space:nowrap;letter-spacing:.04em;flex:1;min-width:0}
.logo small{display:block;margin-top:3px;font-family:var(--body);font-size:11px;color:var(--muted);letter-spacing:.08em}
select,input,button{font:inherit;color:inherit}
select,input{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0}
button{cursor:pointer;border:0;border-radius:12px;padding:9px 14px;background:var(--panel);border:1px solid var(--line)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
.btn-main{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:900;border-radius:999px;box-shadow:0 4px 0 #9e2a17}
.btn-main:active{transform:translateY(1px)}
.mode{font-size:12px;padding:6px 10px}
.mode.on{background:var(--leaf);border-color:var(--leaf);color:var(--lemon)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--leaf);border-top:6px solid transparent;border-image:repeating-linear-gradient(90deg,#e8452c 0 10px,#f39a1e 10px 20px,#f5d63d 20px 30px,#efdca6 30px 40px,#9ccc3c 40px 50px,#4f7d2a 50px 60px,#8a6a3a 60px 70px,#9b2f5e 70px 80px) 1;
  display:flex;justify-content:center;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav .in{display:flex;max-width:520px;width:100%;gap:2px}
nav button{flex:1;background:none;border:0;padding:6px 2px;font-size:11px;color:#d9ebb0;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button .ic{font-family:var(--display);font-size:17px;line-height:1}
nav button.on{color:#fff;font-weight:700}
nav button.on .ic{color:var(--lemon)}
h2{font-family:var(--display);font-weight:800;color:var(--ink);border-left:6px solid var(--tomato);padding-left:8px;font-size:18px;margin:22px 0 10px;letter-spacing:.04em}
.card{background:var(--panel);border:2px solid var(--line);border-radius:18px;box-shadow:0 3px 0 #c9df82;padding:14px}
.stack{display:flex;flex-direction:column;gap:10px}
.muted{color:var(--muted);font-size:13px}
.demo{font-size:12px;color:var(--muted);border:1px dashed var(--line);border-radius:8px;padding:8px 10px;margin-top:12px}

/* hero */
.hero{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:center;margin-top:14px}
.sprite{width:120px;height:120px;image-rendering:pixelated;background:var(--stage);border:1px solid var(--line);border-radius:10px}
.name{font-weight:900;font-size:18px;line-height:1.3}
.cls{font-family:var(--display);color:var(--beet);font-size:14px}
.lv{font-family:var(--display);font-size:30px;line-height:1}
.bar{height:10px;background:var(--floor);border-radius:5px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--carrot),var(--lemon));transition:width .6s}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.stat{display:flex;align-items:center;gap:10px;background:var(--floor-2);border-radius:14px;padding:8px 10px;min-width:0}
.plate{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--display);font-size:11px;color:#fff;
  box-shadow:inset 0 0 0 4px rgba(0,0,0,.25),inset 0 0 0 9px rgba(255,255,255,.12)}
.stat b{font-family:var(--display);font-weight:800;font-size:18px;display:block;line-height:1.1}
.stat span{font-size:11px;color:var(--muted)}
.titles{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--floor-2);border:1px solid var(--line)}
.chip.gold{border-color:var(--gold);color:var(--gold)}
.streak{display:flex;gap:4px;margin-top:6px}
.streak i{flex:1;height:18px;border-radius:3px;background:var(--floor-2);border:1px solid var(--line)}
.streak i.on{background:var(--green);border-color:var(--green)}

/* log */
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}.seg button[data-k=cardio],.seg button[data-k=in]{font-size:12px;padding-top:6px;padding-bottom:6px;opacity:.85}
.seg button{flex:1;font-size:13px}
.seg button.on{background:var(--leaf);color:#fff;border-color:var(--leaf);font-weight:700}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px;min-width:0}
.preview{font-size:13px;color:var(--muted)}
.preview b{color:var(--accent);font-family:var(--display);font-weight:800;font-size:16px}

/* feed */
.post{display:grid;grid-template-columns:40px 1fr;gap:10px}
.av{width:40px;height:40px;border-radius:12px;background:var(--stage);image-rendering:pixelated}
.post .who{font-weight:700;font-size:14px}
.post .what{font-size:14px;margin-top:2px}
.post .meta{display:flex;justify-content:space-between;align-items:center;margin-top:6px;gap:8px}
.cheer{font-size:12px;padding:4px 10px}
.cheer.done{border-color:var(--red);color:var(--red)}
.tag{font-size:11px;font-weight:700;padding:1px 6px;border-radius:4px;color:#111}

/* rank */
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td{padding:8px 4px;border-bottom:1px solid var(--line);font-size:14px}
td.n{font-family:var(--display);width:30px;color:var(--muted)}
td.r{text-align:right;font-family:var(--display)}
tr.me td{color:var(--tomato);font-weight:700}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;text-align:center}
.vs .big{font-family:var(--display);font-size:24px}

/* boss */
.boss{text-align:center}
.boss canvas{width:180px;height:180px;image-rendering:pixelated;display:block;margin:8px auto}
.hp{height:16px;background:var(--floor);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.hp i{display:block;height:100%;background:var(--red);transition:width .8s}
.contrib{display:flex;flex-direction:column;gap:6px;text-align:left;margin-top:12px}
.contrib div{display:grid;grid-template-columns:5.5em 1fr 4em;gap:8px;align-items:center;font-size:13px}
.contrib s{display:block;height:8px;background:var(--carrot);border-radius:4px;text-decoration:none}

/* overlay */
.ov{position:fixed;inset:0;z-index:20;background:rgba(243,249,220,.96);display:grid;place-items:center;padding:24px}
.ov .box{text-align:center;max-width:320px}
.ov .t{font-family:var(--display);font-size:36px;color:var(--accent);animation:pop .5s ease-out}
.ov .s{margin:8px 0 18px}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.hw{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hw .btn-main{flex:none;padding:8px 12px}
.stampmark{flex:none;width:44px;height:44px;border-radius:50%;border:3px solid var(--red);color:var(--red);display:grid;place-items:center;font-weight:900;font-size:18px;transform:rotate(-12deg)}
@media (max-width:440px){.logo{flex-basis:100%}.vlogo b{font-size:21px}}
.zk{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.zc{background:var(--panel);border:1.5px solid var(--line);border-radius:16px;padding:8px;text-align:center;min-width:0}
.zc canvas{width:100%;max-width:96px;aspect-ratio:1;image-rendering:pixelated;background:var(--stage);border-radius:10px;display:block;margin:0 auto}
.zc.lock canvas{opacity:1}
.zc.now{border-color:var(--tomato);box-shadow:0 0 0 2px var(--lemon)}
.zl{font-family:var(--display);color:var(--beet);font-size:13px;margin-top:4px}
.zy{font-size:10px;color:var(--muted);line-height:1.3;word-break:break-all}
.zn{font-weight:700;font-size:13px;line-height:1.3}
.za{font-size:11px;color:var(--muted);line-height:1.4}
.zt{font-size:11px;font-weight:900;color:#111;background:var(--yellow);border-radius:4px;margin-top:4px}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:15;background:var(--chalk);color:var(--floor);font-weight:700;padding:8px 14px;border-radius:8px;font-size:14px;max-width:90vw}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* つぶつぶ見出し：深緑のリボンに、野菜色のつぶが入った白い丸文字 */
h2{display:table;border-left:0;padding:4px 16px 5px;margin:24px 0 12px;font-size:19px;letter-spacing:.06em;color:#fff;
  background:var(--ink);border-radius:12px 4px 12px 4px;box-shadow:3px 3px 0 var(--lemon)}
h2 small{color:#fff!important;font-size:12px!important;white-space:nowrap}
h2 .tb{color:#fff;-webkit-text-fill-color:#fff}
.heroes{gap:4px!important}
.vhero{padding:4px 1px 5px!important;justify-content:flex-start}

function levelOf(xp){let lv=1,need=63,acc=0;while(xp>=acc+need){acc+=need;lv++;need=50+13*lv;}return{lv,into:xp-acc,need};}
function classOf(m){
  const s=m.stats,arr=[['str','重戦士'],['end','旅人'],['tec','剣術師'],['grit','守護騎士']].sort((a,b)=>s[b[0]]-s[a[0]]);
  const top=s[arr[0][0]],sec=s[arr[1][0]];
  if(levelOf(total(m)).lv<3)return'見習い冒険者';
  if(sec>top*0.8)return'勇者';
  return arr[0][1];
}
